[package]
name = "photonoxide-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "External libraries for photonoxide, found and loaded at run time: the one crate that calls C"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/photonoxide"
# not published until its first backend lands (#175, #188)
publish = false

[dependencies]
photonoxide = { path = ".." }
libloading = "0.9.0"
num-complex = "0.4"
