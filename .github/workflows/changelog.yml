name: Changelog

# The release PR's new CHANGELOG.md section must list every PR merged since the last release.
# release-plz gives the crate's changelog only the commits that touch the crate's files, and
# Cargo.toml excludes studio/ and site/, so a PR that changed only those is left out although the
# release carries the program built from it (the native crates too). This lists such PRs, and
# reports a "Changelog" status on the release PR's head commit.
#
# Called after release-plz opens or updates the release PR (release-plz.yml: its commits, pushed
# with GITHUB_TOKEN, start no CI), with `fill`: the missing lines are added to their groups and
# pushed to the release PR, since release-plz rewrites the section after every merge and would
# drop lines added by hand. Called also when someone pushes to the release PR (ci.yml), to check.
on:
  workflow_call:
    inputs:
      branch:
        description: the release PR's branch
        required: true
        type: string
      fill:
        description: add the missing lines to the release PR instead of failing
        required: false
        default: false
        type: boolean

# the caller's: read and statuses from ci.yml, write too from release-plz.yml (to push the lines)

jobs:
  check:
    name: Every PR since the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          # the token stays only when the missing lines are pushed
          persist-credentials: ${{ inputs.fill }}
      - name: Check the new section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILL: ${{ inputs.fill }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD origin/main)
          tag=$(git describe --tags --abbrev=0 --match 'v*' "$base")
          # the section release-plz wrote: from the first version heading to the next
          section=$(awk '/^## \[Unreleased\]/ { next } /^## \[/ { n++ } n == 1' CHANGELOG.md)
          pull="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull"
          # release-plz.toml's commit_parsers: these types are skipped, except a breaking build
          skipped='^(test|ci|build|chore|style)[(:!]'
          title='^([a-z]+)(\(([^)]*)\))?!?: (.*) \(#[0-9]+\)$'
          missing=()
          lines=""
          while IFS= read -r subject; do
            [[ $subject =~ \(#([0-9]+)\)$ ]] || continue
            n=${BASH_REMATCH[1]}
            if [[ $subject =~ $skipped && ! $subject =~ ^build! ]]; then continue; fi
            grep -qF "[#$n]($pull/$n)" <<<"$section" && continue
            missing+=("#$n")
            if [[ $subject =~ $title ]]; then
              case ${BASH_REMATCH[1]} in
                feat) group=Added ;; fix) group=Fixed ;; perf) group=Performance ;;
                refactor | build) group=Changed ;; docs) group=Documentation ;; *) group="Project setup" ;;
              esac
              scope=${BASH_REMATCH[3]:+*(${BASH_REMATCH[3]})* }
              lines+="$group: - $scope${BASH_REMATCH[4]} ([#$n]($pull/$n))"$'\n'
            else
              lines+="Project setup: - ${subject% (#*} ([#$n]($pull/$n))"$'\n'
            fi
          done < <(git log --reverse --format=%s "$tag..$base")

          if (( ${#missing[@]} > 0 )) && [[ "$FILL" == true ]]; then
            # each line after the last of its group in the new section, or in a new group at the
            # section's end
            printf '%s' "$lines" > "$RUNNER_TEMP/missing.txt"
            perl -e '
              my %order = ("Added" => 0, "Fixed" => 1, "Performance" => 2, "Changed" => 3,
                           "Documentation" => 4, "Project setup" => 5);
              open my $m, "<", "$ENV{RUNNER_TEMP}/missing.txt" or die;
              my @add = map { chomp; [split /: /, $_, 2] } grep { /\S/ } <$m>;
              local $/; open my $f, "<", "CHANGELOG.md" or die; my $t = <$f>; close $f;
              my $s = index($t, "\n## [", index($t, "## [Unreleased]") + 1);
              die "no version section" if $s < 0;
              my $e = index($t, "\n## [", $s + 1); $e = length $t if $e < 0;
              my $sec = substr($t, $s, $e - $s);
              for (@add) {
                my ($g, $line) = @$_;
                if ($sec =~ /\n### <!-- \d+ -->\Q$g\E\n\n(?:- [^\n]*\n)*/) {
                  substr($sec, $+[0], 0) = "$line\n";
                } else {
                  $sec =~ s/\n*\z/\n\n### <!-- $order{$g} -->$g\n\n$line\n/;
                }
              }
              substr($t, $s, $e - $s) = $sec;
              open $f, ">", "CHANGELOG.md" or die; print $f $t;'
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "docs(changelog): the PRs release-plz left out: ${missing[*]}"
            git push -q origin "HEAD:$BRANCH"
            state=success
            description="Every PR since $tag is in the new section (added ${missing[*]})"
            {
              echo "$description:"
              echo
              printf '%s' "$lines"
            } >> "$GITHUB_STEP_SUMMARY"
          elif (( ${#missing[@]} == 0 )); then
            state=success
            description="Every PR since $tag is in the new section"
            echo "$description." >> "$GITHUB_STEP_SUMMARY"
          else
            state=failure
            description="Missing since $tag: ${missing[*]}"
            {
              echo "The new CHANGELOG.md section leaves out ${#missing[@]} PRs merged since $tag."
              echo "Add each line to its group, push to the release PR, then merge it:"
              echo
              echo '```markdown'
              printf '%s' "$lines"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s' "$lines"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=Changelog -f description="${description:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          [[ $state == success ]]
