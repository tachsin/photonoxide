name: Release

on:
  push:
    branches: [main]

jobs:
  # after a release PR is merged: publish to crates.io, tag the version, create the GitHub release.
  # crates.io trusts this workflow file (trusted publishing): release-plz exchanges the job's
  # OIDC token for a short-lived crates.io token, so no registry token is stored. It only does
  # so when CARGO_REGISTRY_TOKEN is absent, so don't set it.
  release:
    name: Release
    if: ${{ github.repository_owner == 'tachsin' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.139
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the photonoxide program for each platform, attached to the release just made. (A release
  # made with GITHUB_TOKEN triggers no workflows, so it is called from here.)
  binaries:
    name: Binaries
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    # the update key and, once set, the Windows and macOS signing secrets
    secrets: inherit

  # open or update the release PR: version bump (checked by cargo-semver-checks) and changelog
  release-pr:
    name: Release PR
    if: ${{ github.repository_owner == 'tachsin' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
