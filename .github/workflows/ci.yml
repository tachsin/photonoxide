name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a push or a pull request changed, so that a change to the docs alone runs only the docs'
  # check. Markdown the program reads (the validation report, the methods' write-ups, the
  # examples' table and outputs, the changelog, the Academy's lessons) still runs the jobs that
  # read it; anything that
  # isn't Markdown or the site runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      validation: ${{ steps.classify.outputs.validation }}
      studio: ${{ steps.classify.outputs.studio }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$GITHUB_SHA"
            base="$PR_BASE"
          else
            range="$PUSH_BEFORE..$GITHUB_SHA"
            base="$PUSH_BEFORE"
          fi
          code=false validation=false studio=false
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # no base to compare with (a new branch): run everything
            code=true
          else
            while IFS= read -r f; do
              case "$f" in
                docs/validation.md) validation=true ;;
                examples/output/*) validation=true; studio=true ;;
                docs/methods/*|examples/README.md|CHANGELOG.md|academy/*) studio=true ;;
                site/*|*.md) ;;
                # the Python package: its own workflow (python-wheels.yml) builds and tests it
                python/*|.github/workflows/python-wheels.yml) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$range")
          fi
          echo "code=$code validation=$validation studio=$studio"
          { echo "code=$code"; echo "validation=$validation"; echo "studio=$studio"; } >> "$GITHUB_OUTPUT"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # every relative link in the Markdown points at something that exists
      - run: bash .github/scripts/check-links.sh

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-features
      # photonoxide-native against its test library; real libraries are found only where installed
      - run: cargo test -p photonoxide-native

  single-thread:
    name: Single thread
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # parallel code must not rely on having more than one thread, and must give the same
      # results on one thread as on many
      - run: cargo test --all-features
        env:
          RAYON_NUM_THREADS: 1

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --check -p photonoxide-native -p photonoxide-native-testlib
      - run: cargo clippy -p photonoxide-native -p photonoxide-native-testlib --all-targets -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  validation:
    name: Validation report
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # every case must pass, and docs/validation.md must be the report the code writes
      - run: cargo test --release --test validation_report -- --ignored

  # Every example reproduces a published result and fails when it doesn't, and prints exactly
  # its committed output (shown on the project site). The 3D devices take minutes each, so each
  # runs on a runner of its own, beside the report, and the rest together on another. The rest
  # run on Windows and macOS too, against the same committed output: the system's maths library
  # mustn't show in what an example prints (issue #280; the Systems workflow runs the 3D devices
  # and the report on those systems, by hand).
  examples:
    name: Examples (${{ matrix.shard }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.validation == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard:
          - the rest
          - splitter_rotator_liu_poon
          - mode_converter_liu_poon
          - mmi_liu_poon
          - coupler_liu_poon
          - crossing_liu_poon ring_liu_poon
        include:
          - os: windows-latest
            shard: the rest
          - os: macos-latest
            shard: the rest
    defaults:
      run:
        shell: bash
    env:
      # the examples with a runner of their own: the shards above but the first
      HEAVY: splitter_rotator_liu_poon mode_converter_liu_poon mmi_liu_poon coupler_liu_poon crossing_liu_poon ring_liu_poon
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Examples, each against its paper, and their output
        run: |
          if [ "$SHARD" = "the rest" ]; then
            names=""
            for example in examples/*.rs; do
              name="$(basename "$example" .rs)"
              case " $HEAVY " in *" $name "*) ;; *) names="$names $name" ;; esac
            done
          else
            names="$SHARD"
          fi
          for name in $names; do
            echo "::group::$name"
            cargo run --release --quiet --example "$name" > "$RUNNER_TEMP/$name.txt"
            diff -u "examples/output/$name.txt" "$RUNNER_TEMP/$name.txt"
            echo "::endgroup::"
          done

  # the studio on each system: its code differs by platform (the nightly channel's prerequisites
  # and installs), so each compiles, lints and runs its tests on its own
  studio:
    name: Studio (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.studio == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # what Tauri needs on Linux: the WebKitGTK web view and its friends
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # type-checks the web view and builds it
      - run: pnpm build
      - run: cargo fmt -p photonoxide-studio --check
      - run: cargo clippy -p photonoxide-studio --all-targets -- -D warnings
      - run: cargo test -p photonoxide-studio

  msrv:
    name: MSRV (1.95)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  # a push to the release PR (lines added to its changelog by hand) is checked again
  changelog:
    name: Changelog
    if: ${{ startsWith(github.head_ref, 'release-plz-') }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/changelog.yml
    with:
      branch: ${{ github.head_ref }}
