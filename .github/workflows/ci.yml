name: CI

# Tests in tiers (issue #315):
#
# - Tier 1, every pull request and every push to main: what the change can break. The area map
#   (.github/areas.sh) turns the changed files into the unit tests, validation cases and examples
#   of their areas and of the areas that use them; a file of no area runs everything. Files
#   nothing reads run only the docs' links. A pull request that changes the library (src/ or the
#   root Cargo.toml) has its public API checked against its base's (cargo-semver-checks).
#   A pull request runs on Linux alone, unless a file that differs by system changed (native/,
#   the studio's Rust code and setup, the toolchain, build scripts, CI's own files, a Rust file
#   with a cfg on the system: .github/areas.sh's OS_FILES): then its unit tests and the studio
#   run on Windows and macOS too. Every push to main runs them on the three systems.
#   The studio's tests come in two tiers (.github/studio-slow-tests.txt): a pull request that
#   changes only what the studio reads as text (the README, the roadmap, the changelog, the
#   Academy, the methods pages, its web view) runs its fast tier, which skips the physics solves;
#   a change to its Rust code, a job or circuit file, or a library area it uses runs every test,
#   as every push to main, Tier 2 and Tier 3 do.
# - Tier 2, the release pull request (release-plz's branch), a pull request labelled `full-ci`
#   (the Full CI workflow starts it), and a change that can alter the dependencies or the
#   features (Cargo.lock's packages, the root Cargo.toml's dependency, feature, patch and
#   workspace tables: .github/dependencies.sh; any other edit of the two is Tier 1, which runs
#   every test on Linux for it): everything, the tests on Linux, Windows and macOS, single-threaded
#   too, every example on all three systems, the 3D devices, the whole validation report and the
#   studio, every test of it, on each system.
# - Tier 3, Mondays (the Weekly workflow, when code changed in the past seven days) and by hand
#   (Run workflow): Tier 2, and the Weekly workflow adds the Libraries workflow's installs, the
#   Systems comparison and every Python wheel.
#
# What a run checks is split among runners (.github/shards.sh, by measured times): the unit tests
# in two jobs on each system, the validation cases in groups, the examples in two jobs on each
# system, so that the longest job, which sets the run's wall time, is short. Every test, case and
# example runs in exactly one job, as it did in one before; the "What changed" job fails when the
# split leaves a case or an example out or runs it twice. On Linux one job ("Release build")
# compiles the validation report's test binary and the examples once, and the jobs of the cases
# and examples download them and run them; on Windows and macOS each examples job builds its own.
#
# A draft pull request runs nothing: its jobs are skipped (a skipped job counts as passed, and
# main has no required check) until it is marked ready for review, which runs CI.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tier:
        description: "2: everything on the three systems; 3: the same (the Weekly workflow adds the rest)"
        type: choice
        options: ["3", "2"]
        default: "3"
  workflow_call:
    inputs:
      tier:
        type: string
        required: true

# A new push to a pull request stops its earlier run, and a new push to main the run of the push
# before it: the newer run checks the older one's commits too (the "What changed" job compares
# main with the last commit whose push run passed). Runs started by hand or by the Weekly
# workflow each run to the end. The other workflows (Release, release-plz, the binaries, the
# Python wheels) keep their own groups: nothing here stops them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # no debug info in debug and test builds: nothing here reads it, and it slows the compiling,
  # the linking and the caches (#507). Panics still say where.
  CARGO_PROFILE_DEV_DEBUG: 0

# The Linux jobs run on ubuntu-24.04, not ubuntu-latest: GitHub moved ubuntu-latest to 26.04 on
# 2026-11-06, and a validation row's text changed with the image (device/compact-ring-closed-form).
# The matrices keep the label ubuntu-latest, so the checks keep their names; runs-on maps it.
# Back to ubuntu-latest once a run there writes the same docs/validation.md and examples' output.
jobs:
  changes:
    name: What changed
    # a draft runs nothing; every other job needs this one, but Docs, which has the same condition
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # the runs of this workflow on main: a push's run compares main with the last that passed
      actions: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      code: ${{ steps.classify.outputs.code }}
      tests: ${{ steps.classify.outputs.tests }}
      test: ${{ steps.classify.outputs.test }}
      release: ${{ steps.classify.outputs.release }}
      release_os: ${{ steps.classify.outputs.release_os }}
      build_cases: ${{ steps.classify.outputs.build_cases }}
      build_examples: ${{ steps.classify.outputs.build_examples }}
      studio: ${{ steps.classify.outputs.studio }}
      studio_tier: ${{ steps.classify.outputs.studio_tier }}
      studio_skip: ${{ steps.classify.outputs.studio_skip }}
      library: ${{ steps.classify.outputs.library }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TIER: ${{ inputs.tier }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tier=${TIER:-1}
          if [ "$EVENT" = pull_request ]; then
            case "$HEAD_REF" in release-plz-*) tier=2 ;; esac
            if jq -e 'index("full-ci")' <<<"$LABELS" > /dev/null; then tier=2; fi
            range="$PR_BASE...$GITHUB_SHA" base="$PR_BASE"
            from=$(git merge-base "$PR_BASE" "$GITHUB_SHA" 2>/dev/null || true)
          else
            base="$PUSH_BEFORE"
            if [ "$EVENT" = push ]; then
              # main against the last commit whose push run passed, not only the push before:
              # a run that a newer push stopped (concurrency, above), or that failed, leaves its
              # commits to the next run, which checks them too
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
              if [ -n "$passed" ] && [ "$passed" != "$GITHUB_SHA" ] &&
                git merge-base --is-ancestor "$passed" "$GITHUB_SHA" 2>/dev/null; then
                base=$passed
                echo "compared with $passed, the last commit whose run passed on main"
              else
                echo "::notice::no passed run on main before this commit found: compared with the push's previous commit"
              fi
            fi
            range="$base..$GITHUB_SHA" from="$base"
          fi
          if [ "$tier" = 1 ]; then
            if ! git cat-file -e "$base^{commit}" 2>/dev/null || [ -z "$from" ]; then
              # no base to compare with (a new branch): everything
              tier=2
            else
              git diff --name-only "$range" > "$RUNNER_TEMP/changed.txt"
              cat "$RUNNER_TEMP/changed.txt"
              # a change that can alter the dependency graph or the features changes what every
              # system builds: Tier 2. Other edits of the two (exclude, metadata, comments,
              # profiles) stay Tier 1, where the area map runs every test on Linux for them
              if grep -qxE 'Cargo\.toml|Cargo\.lock' "$RUNNER_TEMP/changed.txt" &&
                bash .github/dependencies.sh "$from" "$GITHUB_SHA"; then
                tier=2
              fi
            fi
          fi
          # the library's public API, checked on a pull request that changes it (src/ or the root
          # manifest), or this workflow, on any tier; not on the release PR, whose version
          # release-plz chose by the same check
          library=false
          if [ "$EVENT" = pull_request ] && [[ "$HEAD_REF" != release-plz-* ]] &&
            git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$range" > "$RUNNER_TEMP/pr-files.txt"
            if grep -qE '^(src/|Cargo\.toml$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/pr-files.txt"; then
              library=true
            fi
          fi
          if [ "$tier" = 1 ]; then
            AREAS_RANGE="$range" bash .github/areas.sh < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/areas.txt"
          else
            bash .github/areas.sh --all < /dev/null > "$RUNNER_TEMP/areas.txt"
          fi
          # every push to main (and Tier 2 and 3): the unit tests and the studio on the three
          # systems, and every test of the studio, whatever changed, so that main stays checked
          # where a pull request ran Linux alone or the studio's fast tier
          if [ "$EVENT" != pull_request ] || [ "$tier" != 1 ]; then
            sed -i -e 's/^systems=.*/systems=all/' -e 's/^studio=fast$/studio=every/' \
              -e 's/^studio_skip=.*/studio_skip=/' "$RUNNER_TEMP/areas.txt"
          fi
          echo "tier $tier"
          cat "$RUNNER_TEMP/areas.txt"
          get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/areas.txt"; }
          code=$(get code) tests=$(get tests) studio_tier=$(get studio) systems=$(get systems)
          # the jobs of the release build and of the unit tests, split by measured times, and
          # the check that every case and example the run wants is in exactly one of them
          bash .github/shards.sh "$tier" < "$RUNNER_TEMP/areas.txt" > "$RUNNER_TEMP/shards.txt"
          shard() { sed -n "s/^$1=//p" "$RUNNER_TEMP/shards.txt"; }

          # the studio: on Linux, or on the three systems; its fast tier skips the slow tests by
          # their exact names
          case "$studio_tier" in
            "") studio='[]' ;;
            *) if [ "$systems" = all ]; then studio='["ubuntu-latest","windows-latest","macos-latest"]'; else studio='["ubuntu-latest"]'; fi ;;
          esac
          skip=""
          for name in $(get studio_skip); do skip+=" --skip $name"; done
          [ -z "$skip" ] || skip="--exact$skip"
          {
            echo "tier=$tier"
            echo "code=$code"
            echo "tests=$tests"
            echo "test=$(shard test)"
            echo "release=$(shard release)"
            echo "release_os=$(shard release_os)"
            echo "build_cases=$(shard build_cases)"
            echo "build_examples=$(shard build_examples)"
            echo "studio=$studio"
            echo "studio_tier=$studio_tier"
            echo "studio_skip=$skip"
            echo "library=$library"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Tier $tier"
            echo
            echo '```'
            cat "$RUNNER_TEMP/areas.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Docs
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the repository's toolchain (rust-toolchain.toml makes rustc, below, ask for it)
      - uses: ./.github/actions/rust-toolchain
      # every relative link in the Markdown points at something that exists
      - run: bash .github/scripts/check-links.sh
      # no math macro GitHub refuses to render, such as \operatorname
      - run: bash .github/scripts/check-math.sh
      # the references index (docs/references.md, docs/references-by-file.md) is the one its
      # generator writes, every cited source has an entry in docs/references.yaml and every entry
      # is cited, every DOI is well formed: the studio's references module, which uses the
      # standard library alone, compiled by itself with its tests (seconds; nothing else builds)
      - name: The references index
        run: |
          rustc --edition 2024 --test -o "$RUNNER_TEMP/references" .github/scripts/references.rs
          "$RUNNER_TEMP/references"
      # the git hooks and the scripts they call, on throwaway repositories (nothing builds); this is
      # the Linux run of the path handling (`pwd -P`), which Git Bash on Windows never takes
      - run: bash .github/scripts/test-hooks.sh
      # shellcheck, which GitHub's ubuntu runners ship, over the hooks and the scripts; -x follows
      # the `source` lines, found from the folder of the file that has them
      - run: shellcheck -x -P SCRIPTDIR .github/hooks/* .github/scripts/*.sh .github/*.sh

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      # the registry and git checkouts: the compiled crates are sccache's, shared across the jobs
      # and the systems, so the two caches don't hold the same things twice (#507)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # sccache in GitHub's cache; the action prints its hits and misses in the job's summary
      - uses: mozilla-actions/sccache-action@v0.0.11
      # and compiling without it when GitHub's cache can't be reached (its storage answers 503 when the
      # account's egress is over its limit): sccache would otherwise fail every compile
      - name: Compile through sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache didn't start (GitHub's cache unreachable): compiling without it"
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --check -p photonoxide-native -p photonoxide-native-testlib
      - run: cargo clippy -p photonoxide-native -p photonoxide-native-testlib --all-targets -- -D warnings
      # the Python package's binding crate builds against the façade, which most areas feed
      - run: cargo fmt --check -p photonoxide-python
      - run: cargo clippy -p photonoxide-python --all-targets -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # dependencies no crate uses (a manifest's `[package.metadata.cargo-machete]` names those
      # used where it doesn't look), for the smallest download
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # Tier 1: the changed areas' unit tests, on Linux (and on Windows and macOS on every push to
  # main and for a file that differs by system). Tier 2 and 3: every test on the three
  # systems, and on Linux once more on one thread: parallel code must not rely on having more
  # than one thread, and must give the same results on one thread as on many. In two jobs on
  # each system (.github/shards.sh): job::'s tests in the first, every other test in the second,
  # which skips the first's (FILTERS: the test binaries' filters and --skip's), so each test runs
  # once; photonoxide-native's tests in the second when there is one, else in the first.
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.test != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test) }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    env:
      TESTS: ${{ needs.changes.outputs.tests }}
      FILTERS: ${{ matrix.filters }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      # the registry and git checkouts: the compiled crates are sccache's, shared across the jobs
      # and the systems, so the two caches don't hold the same things twice (#507)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # sccache in GitHub's cache; the action prints its hits and misses in the job's summary
      - uses: mozilla-actions/sccache-action@v0.0.11
      # and compiling without it when GitHub's cache can't be reached (its storage answers 503 when the
      # account's egress is over its limit): sccache would otherwise fail every compile
      - name: Compile through sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache didn't start (GitHub's cache unreachable): compiling without it"
          fi
      # the library's test binary alone: its few doc tests would build the library once more (two
      # minutes), so they run with every test
      - name: The changed areas' unit tests
        if: env.TESTS != '' && env.TESTS != '*' && env.FILTERS != ''
        # shellcheck disable=SC2086
        run: cargo test --all-features --lib -- $FILTERS
      # this job's share of every test (the filters pick by name in each test binary and in the
      # doc tests), and photonoxide-native's tests with them where the job runs them (its
      # filters are then only --skip's, which no test of photonoxide-native's has in its name).
      # In one Cargo command with photonoxide's own, every feature on: Cargo then resolves the
      # features of the crates both use as it does for photonoxide's tests alone (photonoxide's
      # dev-dependencies widen some, syn's and memchr's among them) and builds nothing of
      # photonoxide's again; `cargo test -p photonoxide-native` on its own after it built about
      # 44 crates once more, the library among them (that step took 185, 384 and 339 s on Linux,
      # Windows and macOS in run 42390305695, mostly building)
      - name: Every test
        if: env.TESTS == '*'
        # shellcheck disable=SC2086
        run: cargo test --all-features $PACKAGES -- $FILTERS
        env:
          PACKAGES: ${{ matrix.native && '-p photonoxide -p photonoxide-native' || '' }}
      - name: Every test, on one thread
        if: env.TESTS == '*' && needs.changes.outputs.tier != '1' && runner.os == 'Linux'
        # shellcheck disable=SC2086
        run: cargo test --all-features -- $FILTERS
        env:
          RAYON_NUM_THREADS: 1
      # photonoxide-native against its test library, where the job doesn't run every test (Tier 1:
      # one command can't hold both crates' tests, since the changed areas' filters reach every
      # test binary and would leave native's out, and no filter picks all of native's and none
      # of photonoxide's); real libraries are found only where installed. Its dev-dependencies
      # repeat photonoxide's and turn on photonoxide's features (native/Cargo.toml, checked by
      # .github/shards.sh), so this command resolves the shared crates as the changed areas' unit
      # tests did and builds only photonoxide's library and native itself
      - name: photonoxide-native
        if: matrix.native && env.TESTS != '*'
        run: cargo test --all-features -p photonoxide-native

  # The release build's checks on Linux, built once: this job compiles the validation report's
  # test binary and the examples the run wants (one release build of the library, through
  # sccache), and hands them to the jobs below, which run them without compiling anything. Before,
  # each of those jobs compiled the same release build itself (3.4 to 5.2 minutes each, about 60
  # job-minutes a run, and sccache missed, its jobs starting together); the artifact is a few
  # hundred MB of binaries, uploaded once and fetched by each job in seconds.
  build:
    name: Release build
    needs: changes
    if: needs.changes.outputs.release != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CASES: ${{ needs.changes.outputs.build_cases }}
      EXAMPLES: ${{ needs.changes.outputs.build_examples }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      # the registry and git checkouts: the compiled crates are sccache's, shared across the jobs
      # and the systems, so the two caches don't hold the same things twice (#507)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # sccache in GitHub's cache; the action prints its hits and misses in the job's summary
      - uses: mozilla-actions/sccache-action@v0.0.11
      # and compiling without it when GitHub's cache can't be reached (its storage answers 503 when the
      # account's egress is over its limit): sccache would otherwise fail every compile
      - name: Compile through sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache didn't start (GitHub's cache unreachable): compiling without it"
          fi
      # the binary `cargo test --release --test validation_report` runs, which Cargo names in its
      # messages
      - name: The validation report's test binary
        if: env.CASES == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build"
          cargo test --release --test validation_report --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/cargo.json"
          bin=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "validation_report" and .profile.test) | .executable // empty' "$RUNNER_TEMP/cargo.json" | tail -n 1)
          if [ -z "$bin" ]; then
            echo "::error::Cargo named no validation_report test binary"
            exit 1
          fi
          cp "$bin" "$RUNNER_TEMP/build/validation_report"
      # all of them at once, so they compile and link side by side (#507)
      - name: The examples
        if: env.EXAMPLES != ''
        run: |
          set -euo pipefail
          args=()
          for name in $EXAMPLES; do args+=(--example "$name"); done
          cargo build --release --quiet "${args[@]}"
          mkdir -p "$RUNNER_TEMP/build/examples"
          for name in $EXAMPLES; do cp "target/release/examples/$name" "$RUNNER_TEMP/build/examples/"; done
      - name: What the jobs fetch
        run: |
          du -sh "$RUNNER_TEMP/build"
          du -ah "$RUNNER_TEMP/build" | sort -h | tail -n 6
      # kept three days, for a rerun of a failed job of the run (a rerun after that reruns this
      # job too); a rerun of this job replaces it
      - uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: ${{ runner.temp }}/build
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # The validation cases (each row against docs/validation.md) and the examples, each against its
  # paper, printing exactly its committed output (shown on the project site), on Linux, from the
  # build above. The slowest groups of cases and the 3D devices each run on a runner of their
  # own, the other examples in two jobs (.github/shards.sh). The report's head and its list of
  # cases, which every job's rows share, are checked in one of them (head: true), not in each.
  release:
    name: Validation and examples (${{ matrix.name }})
    needs: [changes, build]
    if: needs.changes.outputs.release != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.release) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CASES: ${{ matrix.cases }}
      EXAMPLES: ${{ matrix.examples }}
    steps:
      # the source tree: the report, the examples' committed output and the files they read
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: ${{ runner.temp }}/build
      # an artifact keeps no file modes
      - run: chmod -R +x "$RUNNER_TEMP/build"
      # as `cargo test` runs it: from the repository's root, with CARGO_MANIFEST_DIR set (the
      # build and this job check the repository out at the same path, which the binary holds)
      - name: Validation cases, each row against docs/validation.md
        if: env.CASES != ''
        env:
          PHOTONOXIDE_VALIDATION_CASES: ${{ matrix.cases }}
          CHECK_HEAD: ${{ matrix.head }}
        run: |
          if [ "$CHECK_HEAD" != true ]; then export PHOTONOXIDE_VALIDATION_ROWS_ONLY=1; fi
          CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE" "$RUNNER_TEMP/build/validation_report" --ignored --nocapture
      # each example's time printed after it, for the shards' balance (.github/shards.sh)
      - name: Examples, each against its paper, and their output
        if: env.EXAMPLES != ''
        run: |
          for name in $EXAMPLES; do
            echo "::group::$name"
            start=$SECONDS
            "$RUNNER_TEMP/build/examples/$name" > "$RUNNER_TEMP/$name.txt"
            diff -u "examples/output/$name.txt" "$RUNNER_TEMP/$name.txt"
            echo "::endgroup::"
            echo "$((SECONDS - start)) s  $name"
          done

  # The examples on Windows and macOS (Tier 2 and 3): the system's maths library mustn't show in
  # what an example prints (issue #280; the Systems workflow runs the 3D devices and the report on
  # those systems). Two jobs on each system, each building its own.
  release-os:
    name: Validation and examples (${{ matrix.name }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.release_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CASES: ${{ matrix.cases }}
      EXAMPLES: ${{ matrix.examples }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      # the registry and git checkouts: the compiled crates are sccache's, shared across the jobs
      # and the systems, so the two caches don't hold the same things twice (#507)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # sccache in GitHub's cache; the action prints its hits and misses in the job's summary
      - uses: mozilla-actions/sccache-action@v0.0.11
      # and compiling without it when GitHub's cache can't be reached (its storage answers 503 when the
      # account's egress is over its limit): sccache would otherwise fail every compile
      - name: Compile through sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache didn't start (GitHub's cache unreachable): compiling without it"
          fi
      - name: Validation cases, each row against docs/validation.md
        if: env.CASES != ''
        run: cargo test --release --test validation_report -- --ignored --nocapture
        env:
          PHOTONOXIDE_VALIDATION_CASES: ${{ matrix.cases }}
      # all of them at once, so they compile and link side by side (#507); the loop below only
      # runs each
      - name: Build the examples
        if: env.EXAMPLES != ''
        run: |
          args=()
          for name in $EXAMPLES; do args+=(--example "$name"); done
          cargo build --release --quiet "${args[@]}"
      # each example's time printed after it, for the shards' balance (.github/shards.sh)
      - name: Examples, each against its paper, and their output
        if: env.EXAMPLES != ''
        run: |
          for name in $EXAMPLES; do
            echo "::group::$name"
            start=$SECONDS
            cargo run --release --quiet --example "$name" > "$RUNNER_TEMP/$name.txt"
            diff -u "examples/output/$name.txt" "$RUNNER_TEMP/$name.txt"
            echo "::endgroup::"
            echo "$((SECONDS - start)) s  $name"
          done

  # The studio: on Linux, and on Windows and macOS on every push to main, Tier 2 and 3, and for a
  # file that differs by system (its code differs by platform: the nightly channel's prerequisites
  # and installs). Its fast tier skips its slow tests (.github/studio-slow-tests.txt: physics
  # solves, each over a minute) by their exact names; every push to main, Tier 2 and 3, and a
  # change to its Rust code, a job or circuit file, or a library area it uses run them all.
  studio:
    name: Studio (${{ matrix.os }}${{ needs.changes.outputs.studio_tier == 'fast' && ', fast tier' || '' }})
    needs: changes
    if: needs.changes.outputs.studio != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.studio) }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 60 # 9 to 21 minutes in recent runs
    env:
      TAURI_APT_PACKAGES: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    defaults:
      run:
        working-directory: studio
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # what Tauri needs on Linux: the WebKitGTK web view and its friends, kept in the Actions
      # cache (installing them took over a minute and a half). The action picks the packages'
      # versions from the image's package lists, which can name versions the mirror has dropped,
      # so the lists are updated first (retried: .github/apt-get-update.sh); its key leaves out
      # the Ubuntu release, so that is the cache's version, and a new ubuntu-latest starts a
      # fresh cache
      - id: ubuntu
        if: runner.os == 'Linux'
        run: |
          bash "$GITHUB_WORKSPACE/.github/apt-get-update.sh"
          echo "release=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.TAURI_APT_PACKAGES }}
          # the number after the release: raise it to drop a bad cache
          version: ubuntu-${{ steps.ubuntu.outputs.release }}-2
      # the action reports success even when its install failed (and caches what it got), so
      # the build's own check: the libraries pkg-config finds, else a plain install
      - if: runner.os == 'Linux'
        run: |
          if pkg-config --exists webkit2gtk-4.1 ayatana-appindicator3-0.1 librsvg-2.0 openssl && [ -f /usr/include/xdo.h ]; then
            exit 0
          fi
          echo "::warning::the cached Tauri packages are missing or incomplete: installing them with apt (raise the cache's version to drop it)"
          sudo apt-get install -y $TAURI_APT_PACKAGES
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - uses: ./.github/actions/rust-toolchain
      # the studio keeps its target/ in rust-cache: through sccache its Tauri build was slower,
      # 17, 27 and 19 min on Linux, Windows and macOS against 12, 27 and 15 (#507)
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # type-checks the web view and builds it
      - run: pnpm build
      # the Fabrication views' animation, its plain functions, by Node's own test runner
      - run: pnpm test
      # and the Windows setup that carries it (studio/setup), built without its payload
      - run: cargo fmt -p photonoxide-studio -p photonoxide-setup --check
      - run: cargo clippy -p photonoxide-studio -p photonoxide-setup --all-targets -- -D warnings
      # SKIP: in the fast tier, `--exact --skip NAME` for each slow test; empty: every test
      - name: cargo test (${{ needs.changes.outputs.studio_tier == 'fast' && 'the fast tier, the slow tests skipped' || 'every test' }})
        env:
          SKIP: ${{ needs.changes.outputs.studio_skip }}
        # shellcheck disable=SC2086
        run: cargo test -p photonoxide-studio -p photonoxide-setup ${SKIP:+-- $SKIP}
      # a slow test renamed without its line in the list runs in the fast tier again: say so
      - name: The slow tests' list names the studio's tests
        if: needs.changes.outputs.studio_tier == 'every' && runner.os == 'Linux'
        run: |
          cargo test -p photonoxide-studio -p photonoxide-setup -q -- --list 2>/dev/null | sed -n 's/: test$//p' > "$RUNNER_TEMP/studio-tests.txt"
          awk '!/^[[:space:]]*(#|$)/ { print $1 }' ../.github/studio-slow-tests.txt | while read -r name; do
            if ! grep -qxF "$name" "$RUNNER_TEMP/studio-tests.txt"; then
              echo "::warning::.github/studio-slow-tests.txt names $name, which no test of the studio has: the fast tier runs it again"
            fi
          done

  msrv:
    name: MSRV (1.95)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # rust-toolchain.toml pins the newest Rust for every cargo in this checkout: this job asks for
    # its own, for rustup, rust-cache and sccache as well as cargo
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      # the registry and git checkouts: the compiled crates are sccache's, shared across the jobs
      # and the systems, so the two caches don't hold the same things twice (#507)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # sccache in GitHub's cache; the action prints its hits and misses in the job's summary
      - uses: mozilla-actions/sccache-action@v0.0.11
      # and compiling without it when GitHub's cache can't be reached (its storage answers 503 when the
      # account's egress is over its limit): sccache would otherwise fail every compile
      - name: Compile through sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache didn't start (GitHub's cache unreachable): compiling without it"
          fi
      - run: cargo check --all-targets --all-features

  # The library's public API, by cargo-semver-checks. A pull request is checked against its base
  # on main, so it answers for its own breaks only, not for those main already has since the
  # last release. The release PR (release-plz's branch), and a run that isn't a pull request, are
  # checked against the latest release on crates.io, the check release-plz runs before it picks
  # the next version. A change a user's code could break on, a public struct's new field say,
  # fails it, unless the pull request says it breaks: a `!` in its title (`fix(fdfd)!: ...`, as
  # Conventional Commits mark it) or the `breaking` label. Release-plz then raises the minor
  # version, 0.5 to 0.6, where a patch was meant.
  semver:
    name: Semver
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # the base commit, which the check builds as its baseline
          fetch-depth: 0
      # the repository's toolchain, which the action below would otherwise replace with the latest
      # stable (its rust-toolchain input wins over rust-toolchain.toml)
      - id: rust
        uses: ./.github/actions/rust-toolchain
      - id: check
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2.9
        with:
          package: photonoxide
          rust-toolchain: ${{ steps.rust.outputs.version }}
          # empty (the latest release) for the release PR and for runs that aren't pull requests
          baseline-rev: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.base.sha || '' }}
      # the title and labels as they are now, not as the run's event had them, so that a rerun
      # after marking the pull request breaking passes
      - name: A break needs the pull request to say so
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          title=$(jq -r .title <<<"$pr")
          if jq -e '[.labels[].name] | index("breaking")' <<<"$pr" > /dev/null ||
            [[ "$title" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            echo "::notice::The public API breaks semver (above), and the pull request says so: the next release raises the minor version."
            exit 0
          fi
          echo "::error::The public API breaks semver against the pull request's base (or, on the release PR, the latest release; the lints above): users' code that compiles against it may not compile against this. Keep the old API working (a field added to a public struct breaks every literal of it: put new settings in a type of their own marked #[non_exhaustive], with a new method taking it), or, if the break is meant, put a ! in the pull request's title (fix(area)!: ...) or add the breaking label, then rerun this job: release-plz will then raise the minor version."
          exit 1

  # a push to the release PR (lines added to its changelog by hand) is checked again
  changelog:
    name: Changelog
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-') }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/changelog.yml
    with:
      branch: ${{ github.head_ref }}
