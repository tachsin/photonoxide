name: Libraries

# Each way of installing an external library that docs/libraries.md lists as checked, run on a
# clean machine: the package is installed, and photonoxide's discovery (photonoxide-native) is
# asked what it finds, and a backend's tests are run with its library required. The default
# build needs none of them; this job only keeps the guides true. The runners have no GPU:
# NVIDIA's libraries are found and loaded, and their backends stay unavailable.
#
# On a pull request only for what the installs check first, how a library is found and loaded
# and the guides that say where it lands; a backend's own code runs against the test library in
# CI, and against the real ones here every Monday (the Weekly workflow, whatever changed: a
# package index that moved shows here, not in a user's install) and by hand.
on:
  pull_request:
    paths:
      - native/src/lib.rs
      - native/src/discovery.rs
      - native/src/library.rs
      - native/src/smoke.rs
      - native/src/intel.rs
      - native/src/nvidia.rs
      - native/src/blas.rs
      - native/src/zstd.rs
      - native/src/hdf5.rs
      - native/examples/**
      - native/Cargo.toml
      - studio/src-tauri/src/libraries.rs
      - studio/src-tauri/src/libraries/**
      - docs/libraries.md
      - .github/workflows/libraries.yml
  workflow_call:
  workflow_dispatch:

# it reads the repository and nothing else: no secrets, no writes
permissions:
  contents: read

# a PR's newer push replaces its older run
concurrency:
  group: libraries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  conda:
    name: conda-forge ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # libraries photonoxide has a backend for: found, and the backend offered
          - { os: ubuntu-latest, package: mkl, found: '^oneMKL 20[0-9]+\.[0-9]+: .*\(from the conda environment\)', backend: '^backend photonoxide-mkl \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=mkl' }
          - { os: windows-latest, package: mkl, found: '^oneMKL 20[0-9]+\.[0-9]+: .*\(from the conda environment\)', backend: '^backend photonoxide-mkl \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=mkl' }
          # cuDSS 0.8, the release photonoxide-native knows (the next one's libcudss.so.1 isn't yet)
          - { os: ubuntu-latest, package: libcudss=0.8, found: '^cuDSS [0-9.]+: .*\(from the conda environment\)' }
          - { os: windows-latest, package: libcudss=0.8, found: '^cuDSS [0-9.]+: .*\(from the conda environment\)' }
          - { os: ubuntu-latest, package: cuda-cudart libcusparse, found: '^cuSPARSE [0-9.]+: .*\(from the conda environment\)' }
          - { os: windows-latest, package: cuda-cudart libcusparse, found: '^cuSPARSE [0-9.]+: .*\(from the conda environment\)' }
          - { os: ubuntu-latest, package: mumps-seq, found: '^MUMPS 5\.[0-9.]+: .*\(from the conda environment\)', backend: '^backend mumps \(direct\): .* available', test: mumps, require: 'PHOTONOXIDE_REQUIRE_MUMPS=1' }
          - { os: windows-latest, package: mumps-seq, found: '^MUMPS 5\.[0-9.]+: .*\(from the conda environment\)', backend: '^backend mumps \(direct\): .* available', test: mumps, require: 'PHOTONOXIDE_REQUIRE_MUMPS=1' }
          - { os: macos-latest, package: mumps-seq, found: '^MUMPS 5\.[0-9.]+: .*\(from the conda environment\)', backend: '^backend mumps \(direct\): .* available', test: mumps, require: 'PHOTONOXIDE_REQUIRE_MUMPS=1' }
          - { os: ubuntu-latest, package: superlu, found: '^SuperLU [567][0-9.]*: .*\(from the conda environment\)', backend: '^backend superlu \(direct\): .* available', test: superlu, require: 'PHOTONOXIDE_REQUIRE_SUPERLU=1' }
          - { os: macos-latest, package: superlu, found: '^SuperLU [567][0-9.]*: .*\(from the conda environment\)', backend: '^backend superlu \(direct\): .* available', test: superlu, require: 'PHOTONOXIDE_REQUIRE_SUPERLU=1' }
          - { os: ubuntu-latest, package: openblas, found: '^OpenBLAS [0-9.]+: .*\(from the conda environment\)', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
          - { os: windows-latest, package: openblas, found: '^OpenBLAS [0-9.]+: .*\(from the conda environment\)', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
          - { os: macos-latest, package: openblas, found: '^OpenBLAS [0-9.]+: .*\(from the conda environment\)', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
          # the exported files' compressor
          - { os: ubuntu-latest, package: zstd, found: '^Zstandard 1\.[0-9.]+: .*\(from the conda environment\)', test: zstd, require: 'PHOTONOXIDE_REQUIRE_ZSTD=1' }
          - { os: windows-latest, package: zstd, found: '^Zstandard 1\.[0-9.]+: .*\(from the conda environment\)', test: zstd, require: 'PHOTONOXIDE_REQUIRE_ZSTD=1' }
          - { os: macos-latest, package: zstd, found: '^Zstandard 1\.[0-9.]+: .*\(from the conda environment\)', test: zstd, require: 'PHOTONOXIDE_REQUIRE_ZSTD=1' }
          - { os: ubuntu-latest, package: hdf5, found: '^HDF5 [12]\.[0-9.]+: .*\(from the conda environment\)', test: hdf5, require: 'PHOTONOXIDE_REQUIRE_HDF5=1' }
          - { os: windows-latest, package: hdf5, found: '^HDF5 [12]\.[0-9.]+: .*\(from the conda environment\)', test: hdf5, require: 'PHOTONOXIDE_REQUIRE_HDF5=1' }
          - { os: macos-latest, package: hdf5, found: '^HDF5 [12]\.[0-9.]+: .*\(from the conda environment\)', test: hdf5, require: 'PHOTONOXIDE_REQUIRE_HDF5=1' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        # on Windows its `conda init --all` fails since 2026-10 ("Operation failed", conda.exe
        # "needs sudo"): micromamba installs the same conda-forge packages there
        if: runner.os != 'Windows'
        with:
          miniforge-version: latest
          activate-environment: libraries
      - uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'Windows'
        with:
          environment-name: libraries
          create-args: ${{ matrix.package }}
          condarc: |
            channels:
              - conda-forge
          init-shell: bash
      - name: Install
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            micromamba list | grep -i -E "mkl|mumps|superlu|openblas|cudss|cuda|cusparse|tbb|openmp|zstd|hdf5" || true
          else
            time conda install -y -c conda-forge ${{ matrix.package }}
            conda list | grep -i -E "mkl|mumps|superlu|openblas|cudss|cuda|cusparse|tbb|openmp|zstd|hdf5" || true
          fi
          du -sh "$CONDA_PREFIX" || true
      - name: Where it landed
        run: |
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          for dir in "$CONDA_PREFIX/lib" "$CONDA_PREFIX/Library/bin" "$CONDA_PREFIX/bin"; do
            ls "$dir" 2>/dev/null | grep -i -E "mkl_rt|mumps|superlu|openblas|cudss|cudart|cusparse|zstd|hdf5" | sed "s|^|$dir/|" || true
          done | tee landed.txt
      - name: The library is there
        if: matrix.file != ''
        run: grep -E '${{ matrix.file }}' landed.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What photonoxide finds
        run: cargo run -p photonoxide-native --example libraries | tee found.txt
      - name: photonoxide finds it
        if: matrix.found != ''
        run: grep -E '${{ matrix.found }}' found.txt
      - name: Its backend is offered
        if: matrix.backend != ''
        run: grep -E '${{ matrix.backend }}' found.txt
      - name: Its backend's tests, the library required
        if: matrix.test != ''
        run: env ${{ matrix.require }} cargo test -p photonoxide-native --release --test ${{ matrix.test }}

  pip:
    name: pip ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, package: mkl, found: '^oneMKL 20[0-9]+\.[0-9]+: ', backend: '^backend pardiso \(direct\): .* available' }
          - { os: windows-latest, package: mkl, found: '^oneMKL 20[0-9]+\.[0-9]+: ', backend: '^backend pardiso \(direct\): .* available' }
          - { os: ubuntu-latest, package: nvidia-cuda-runtime nvidia-cusparse, found: '^cuSPARSE [0-9.]+: .*\(from a Python wheel\)' }
          - { os: windows-latest, package: nvidia-cuda-runtime nvidia-cusparse, found: '^cuSPARSE [0-9.]+: .*\(from a Python wheel\)' }
          - { os: ubuntu-latest, package: 'nvidia-cudss-cu13==0.8.*', found: '^cuDSS [0-9.]+: .*\(from a Python wheel\)' }
          - { os: windows-latest, package: 'nvidia-cudss-cu13==0.8.*', found: '^cuDSS [0-9.]+: .*\(from a Python wheel\)' }
          - { os: ubuntu-latest, package: scipy-openblas32, found: '^OpenBLAS [0-9.]+: .*\(from a Python wheel\)', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
          - { os: windows-latest, package: scipy-openblas32, found: '^OpenBLAS [0-9.]+: .*\(from a Python wheel\)', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
          - { os: macos-latest, package: scipy-openblas32, found: '^OpenBLAS [0-9.]+: .*\(from a Python wheel\)', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: |
          time python -m pip install ${{ matrix.package }}
          python -m pip list | grep -i -E "mkl|nvidia|tbb|openmp" || true
      - name: Where it landed
        run: |
          root="$(python -c 'import sys; print(sys.prefix)')"
          echo "sys.prefix=$root"
          find "$root" -iname "*mkl_rt*" -o -iname "*cudss*" -o -iname "*cudart*" -o -iname "*cusparse*" -o -iname "*scipy_openblas*" 2>/dev/null | grep -v -E "\.(py|pyc|h|txt)$|dist-info" | head -40 || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What photonoxide finds
        run: cargo run -p photonoxide-native --example libraries | tee found.txt
      - name: photonoxide finds it
        run: grep -E '${{ matrix.found }}' found.txt
      - name: Its backend is offered
        if: matrix.backend != ''
        run: grep -E '${{ matrix.backend }}' found.txt
      - name: Its backend's tests, the library required
        if: matrix.test != ''
        run: env ${{ matrix.require }} cargo test -p photonoxide-native --release --test ${{ matrix.test }}

  apt:
    name: apt ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        package: [libmkl-rt, libmumps-seq-dev, libsuperlu-dev, libopenblas-dev, libzstd1, libhdf5-dev]
        include:
          - { package: libhdf5-dev, found: '^HDF5 1\.[0-9.]+: /usr/lib/', test: hdf5, require: 'PHOTONOXIDE_REQUIRE_HDF5=1' }
          - { package: libzstd1, found: '^Zstandard 1\.[0-9.]+: /(usr/)?lib/', test: zstd, require: 'PHOTONOXIDE_REQUIRE_ZSTD=1' }
          - { package: libmkl-rt, found: '^oneMKL 2020\.[0-9]+: /usr/lib/' }
          - { package: libmumps-seq-dev, found: '^MUMPS 5\.[0-9.]+: /usr/lib/', backend: '^backend mumps \(direct\): .* available', test: mumps, require: 'PHOTONOXIDE_REQUIRE_MUMPS=1' }
          - { package: libsuperlu-dev, found: '^SuperLU [567][0-9.]*: /usr/lib/', backend: '^backend superlu \(direct\): .* available', test: superlu, require: 'PHOTONOXIDE_REQUIRE_SUPERLU=1' }
          - { package: libopenblas-dev, found: '^OpenBLAS [0-9.]+: /usr/lib/', backend: '^backend photonoxide-openblas \(direct\): .* available', test: blas, require: 'PHOTONOXIDE_REQUIRE_BLAS=openblas' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          sudo apt-get update
          time sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.package }}
          dpkg -l | grep -i -E "mkl|mumps|superlu|openblas" || true
      - name: Where it landed
        run: |
          for p in $(dpkg -l | awk '{print $2}' | grep -i -E "mkl|mumps|superlu|openblas"); do
            dpkg -L "$p" | grep -E "\.so" || true
          done | tee landed.txt
      - name: The library is there
        if: matrix.file != ''
        run: grep -E '${{ matrix.file }}' landed.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What photonoxide finds
        run: cargo run -p photonoxide-native --example libraries | tee found.txt
      - name: photonoxide finds it
        if: matrix.found != ''
        run: grep -E '${{ matrix.found }}' found.txt
      - name: Its backend is offered
        if: matrix.backend != ''
        run: grep -E '${{ matrix.backend }}' found.txt
      - name: Its backend's tests, the library required
        if: matrix.test != ''
        run: env ${{ matrix.require }} cargo test -p photonoxide-native --release --test ${{ matrix.test }}

  mumps-source:
    # MUMPS releases no package manager ships yet, built from mumps-solver.org's source
    # (sequential, gfortran, the reference BLAS and LAPACK): each release's structure is read at
    # its own layout, so each layout photonoxide-native knows is checked on a real library
    name: MUMPS ${{ matrix.version }} from source (ubuntu-24.04)
    strategy:
      fail-fast: false
      matrix:
        version: ['5.9.1']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the compilers and the BLAS
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gfortran libblas-dev liblapack-dev
      - uses: actions/cache@v6
        id: built
        with:
          path: mumps
          key: mumps-${{ matrix.version }}-seq-ubuntu-24.04-gfortran
      - name: Build MUMPS
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o mumps.tar.gz "https://mumps-solver.org/MUMPS_${{ matrix.version }}.tar.gz"
          mkdir mumps
          tar xzf mumps.tar.gz -C mumps --strip-components=1
          cd mumps
          sed -e 's/^CC *=.*/CC = gcc/' -e 's/^FC *=.*/FC = gfortran/' -e 's/^FL *=.*/FL = gfortran/' \
            -e 's/^OPTF *=.*/OPTF = -O2 -fallow-argument-mismatch/' -e 's/^OPTC *=.*/OPTC = -O2 -I./' \
            -e 's/^OPTL *=.*/OPTL = -O2/' Make.inc/Makefile.inc.generic.SEQ > Makefile.inc
          time make -j4 PLAT=_seq zshared > build.log 2>&1 || { tail -50 build.log; exit 1; }
      - name: Where it landed
        run: ls mumps/lib | tee landed.txt && grep -E '^libzmumps_seq\.so$' landed.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What photonoxide finds
        run: LD_LIBRARY_PATH="$PWD/mumps/lib" cargo run -p photonoxide-native --example libraries | tee found.txt
      - name: photonoxide finds it
        run: |
          grep -F "MUMPS ${{ matrix.version }}: $PWD/mumps/lib/libzmumps_seq.so" found.txt
      - name: Its backends are offered
        run: |
          grep -E '^backend mumps \(direct\): .* available' found.txt
          grep -E '^backend mumps-blr \(direct\): .* available' found.txt
      - name: Its backend's tests, the library required
        run: LD_LIBRARY_PATH="$PWD/mumps/lib" PHOTONOXIDE_REQUIRE_MUMPS=1 cargo test -p photonoxide-native --release --test mumps

  macos:
    # nothing to install: what each macOS's Accelerate has, and its backend's tests
    name: Accelerate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # complex LU from macOS 15.5, complex symmetric L D Lᵀ from macOS 26
          - { os: macos-15, require: 'PHOTONOXIDE_REQUIRE_ACCELERATE=1' }
          - { os: macos-15-intel, require: 'PHOTONOXIDE_REQUIRE_ACCELERATE=1' }
          - { os: macos-26, require: 'PHOTONOXIDE_REQUIRE_ACCELERATE=symmetric' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sw_vers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What photonoxide finds
        run: cargo run -p photonoxide-native --example libraries | tee found.txt
      - name: photonoxide finds it
        run: |
          grep -E '^Accelerate [0-9.]+: /System/Library/Frameworks/' found.txt
      - name: Its backend is offered
        run: |
          grep -E '^backend accelerate \(direct\): .* available' found.txt
      - name: Its backend's tests, the library required
        run: env ${{ matrix.require }} cargo test -p photonoxide-native --release --test accelerate
      - name: Its dense kernels' tests, the library required
        run: PHOTONOXIDE_REQUIRE_BLAS=accelerate cargo test -p photonoxide-native --release --test blas

  armpl:
    # Arm Performance Libraries on Apple silicon, by Homebrew's cask: found, offered, and their
    # dense kernels' tests run. (Windows on Arm isn't checked: its runner image has no winget,
    # and Arm's download server refuses GitHub's runners, "Access Denied", 2026-10-15.)
    name: Arm PL brew (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: time brew install --cask arm-performance-libraries
      - name: Where it landed
        run: |
          find /opt/arm -iname "*armpl_lp64*" 2>/dev/null | head -20 || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What photonoxide finds
        run: cargo run -p photonoxide-native --example libraries | tee found.txt
      - name: photonoxide finds it
        run: |
          grep -E '^Arm Performance Libraries [0-9.]+: ' found.txt
      - name: Its backend is offered
        run: |
          grep -E '^backend photonoxide-armpl \(direct\): .* available' found.txt
      - name: Its dense kernels' tests, the library required
        run: PHOTONOXIDE_REQUIRE_BLAS=armpl cargo test -p photonoxide-native --release --test blas

  winget:
    name: winget's index (windows-latest)
    runs-on: windows-latest
    steps:
      # the installers are several gigabytes and ask for elevation: only that the index still
      # has the packages the guides name, at which version
      - name: The index has the packages
        shell: pwsh
        run: |
          winget --version
          winget show --id Intel.oneMKL --exact --accept-source-agreements --disable-interactivity | Select-String -Pattern 'Found|Version|Installer Type'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          winget show --id Nvidia.CUDA --exact --accept-source-agreements --disable-interactivity | Select-String -Pattern 'Found|Version|Installer Type'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # an installer for Windows on Arm only: x86-64's winget finds the package and none to run
          winget show --id Arm.ArmPerformanceLibraries --exact --accept-source-agreements --disable-interactivity | Select-String -Pattern 'Found|Version'
          if (-not $?) { exit 1 }
