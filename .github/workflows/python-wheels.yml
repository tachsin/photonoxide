name: Python wheels

# The photonoxide package for Python (python/): abi3 wheels, one per platform for every CPython
# from 3.10, and one per platform for free-threaded CPython 3.14 (3.14t), which can't load abi3.
#
# - On pull requests that touch the package, the façade it wraps, the files its tests read, or
#   the dependencies (so the release pull request too): the binding crate linted, and the wheels
#   of Linux x86_64, macOS ARM64 and Windows x64 built and tested, on the lowest Python and on
#   3.14t. (CI lints the binding crate on every code change; issue #315.)
# - Every Monday when code changed that week (the Weekly workflow), and on a pull request
#   labelled `full-ci` (the Full CI workflow): every platform and the sdist.
# - By hand (workflow_dispatch): every platform and the sdist; with `publish`, to PyPI too, and
#   the API reference to GitHub Pages. The release workflow (release-plz.yml) starts it so, at
#   the new release's tag, once PyPI is set up (the PYPI_PUBLISH variable); a post-release
#   (0.5.1.post1, docs/python.md) is started by hand.
# - Every run: the API reference, made by pdoc from the docstrings and type stubs of the Linux
#   wheel it built, as the artifact `python-reference`. A publishing run at a release's tag also
#   attaches its pages to the GitHub release, where the site's reference page reads them
#   (site/README.md); the reference is never committed.
#
# PyPI trusts this workflow file and the `pypi` environment (trusted publishing: no token is
# stored). Setting that up on pypi.org is done once, by hand: docs/python.md, "Publishing".
on:
  pull_request:
    paths:
      - "python/**"
      - "src/facade.rs"
      - "src/facade/**"
      - "docs/python.md"
      # the Rust twins whose output python/tests/test_examples.py compares
      - "examples/output/silicon_index.txt"
      - "examples/output/slab_soi.txt"
      # the design page, whose Python calls python/tests/test_methods.py runs too
      - "docs/design.md"
      # the write-ups whose Python calls python/tests/test_methods.py runs
      - "docs/methods/catalogue.md"
      - "docs/methods/circuits.md"
      - "docs/methods/compact.md"
      - "docs/methods/devices.md"
      - "docs/methods/export.md"
      - "docs/methods/fabrication.md"
      - "docs/methods/fdfd-ports.md"
      - "docs/methods/fields.md"
      - "docs/methods/nonlinear.md"
      - "docs/methods/slab.md"
      - "docs/methods/stacks.md"
      - "docs/methods/vector.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "jobs/**"
      - ".github/workflows/python-wheels.yml"
  workflow_call:
  workflow_dispatch:
    inputs:
      publish:
        description: "publish the wheels and the sdist to PyPI, and attach the API reference to the release (at a tag)"
        required: false
        default: false
        type: boolean

# A new push to a pull request stops its earlier build; releases and manual runs run to the end
concurrency:
  group: python-wheels-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check -p photonoxide-python
      - run: cargo clippy -p photonoxide-python --all-targets -- -D warnings

  # the platforms: three on pull requests, every one otherwise
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all='[
            {"id": "linux-x86_64", "runner": "ubuntu-latest", "target": "x86_64", "manylinux": "auto", "test": true, "pr": true},
            {"id": "linux-aarch64", "runner": "ubuntu-24.04-arm", "target": "aarch64", "manylinux": "auto", "test": true, "pr": false},
            {"id": "musllinux-x86_64", "runner": "ubuntu-latest", "target": "x86_64", "manylinux": "musllinux_1_2", "test": false, "pr": false},
            {"id": "musllinux-aarch64", "runner": "ubuntu-24.04-arm", "target": "aarch64", "manylinux": "musllinux_1_2", "test": false, "pr": false},
            {"id": "macos-x86_64", "runner": "macos-latest", "target": "x86_64", "manylinux": "", "test": false, "pr": false},
            {"id": "macos-arm64", "runner": "macos-latest", "target": "aarch64", "manylinux": "", "test": true, "pr": true},
            {"id": "windows-x64", "runner": "windows-latest", "target": "x64", "manylinux": "", "test": true, "pr": true}
          ]'
          if [ "$EVENT" = pull_request ]; then
            matrix=$(jq -c '[.[] | select(.pr)]' <<<"$all")
          else
            matrix=$(jq -c '.' <<<"$all")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel (${{ matrix.platform.id }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # the package has photonoxide's version and the dependency versions of Cargo.lock: both are
      # the workspace's, in the root Cargo.toml and Cargo.lock
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: python
          args: --profile dist --locked --out dist
      # free-threaded CPython: PyO3 makes a version-specific wheel for it despite the abi3
      # feature. On Linux, the manylinux and musllinux containers have it.
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: python
          args: --profile dist --locked --out dist -i python3.14t
      # the lowest supported Python: an abi3 wheel works on every version from it
      - uses: actions/setup-python@v7
        if: matrix.platform.test
        with:
          python-version: "3.10"
      - name: Test
        if: matrix.platform.test
        run: |
          python -m pip install pytest python/dist/*-abi3-*.whl
          cd python/tests && python -m pytest -q -p no:cacheprovider
      - uses: actions/setup-python@v7
        id: free-threaded
        if: matrix.platform.test
        with:
          python-version: "3.14t"
      - name: Test free-threaded
        if: matrix.platform.test
        run: |
          python="${{ steps.free-threaded.outputs.python-path }}"
          "$python" -m pip install pytest python/dist/*-cp314t-*.whl
          cd python/tests && "$python" -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.platform.id }}
          path: python/dist

  # the API reference, as docs.rs makes Rust's: pdoc reads the docstrings and type stubs of the
  # Linux wheel just built, so the reference can't drift from the package. One self-contained
  # HTML file per module (no search index, no scripts), which the site serves
  reference:
    name: API reference
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wheels-linux-x86_64
          path: python/dist
      - uses: astral-sh/setup-uv@v10.3.2
      # pdoc's version is the package's `docs` extra (python/pyproject.toml); run outside python/,
      # so the package imported is the installed wheel
      - name: Generate
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/venv"
          export VIRTUAL_ENV="$RUNNER_TEMP/venv"
          wheel=$(ls python/dist/*-abi3-*.whl)
          uv pip install "photonoxide[docs] @ file://$PWD/$wheel"
          cd "$RUNNER_TEMP"
          "$VIRTUAL_ENV/bin/pdoc" photonoxide --docformat restructuredtext --no-search             --footer-text "photonoxide $("$VIRTUAL_ENV/bin/python" -c 'import photonoxide; print(photonoxide.__version__)')"             -o "$GITHUB_WORKSPACE/reference"
          test -f "$GITHUB_WORKSPACE/reference/photonoxide.html"
          test -f "$GITHUB_WORKSPACE/reference/photonoxide/errors.html"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-reference
          path: reference

  # the reference to the GitHub release of the tag this run is at, one asset per page, named
  # python-reference-<page's path with / as .>: python-reference-photonoxide.html,
  # python-reference-photonoxide.errors.html, python-reference-index.html. The site's reference
  # page (site/README.md) reads them from the latest release
  attach:
    name: Attach the API reference to the release
    needs: reference
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-reference
          path: reference
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd reference
          for page in $(find . -name '*.html' | sed 's|^\./||'); do
            asset="python-reference-${page//\//.}"
            cp "$page" "$RUNNER_TEMP/$asset"
            gh release upload "$TAG" "$RUNNER_TEMP/$asset" --clobber
          done

  sdist:
    name: Source distribution
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          working-directory: python
          # the sdist includes Cargo.lock and the library it wraps (sdist has no --locked)
          args: --out dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-sdist
          path: python/dist

  # to PyPI, as a trusted publisher: PyPI trusts this workflow file and the `pypi` environment,
  # so no token is stored
  pypi:
    name: Publish to PyPI
    needs: [lint, wheels, sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/photonoxide/
    permissions:
      id-token: write
    steps:
      - name: PyPI is set up
        env:
          READY: ${{ vars.PYPI_PUBLISH }}
        run: |
          if [ "$READY" != true ]; then
            echo "::error::PyPI's trusted publisher isn't set up (the PYPI_PUBLISH variable): see docs/python.md, Publishing"
            exit 1
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # every file of one version, the one PyPI gets
      - name: One version
        run: |
          ls dist
          versions=$(ls dist | sed -E 's/^photonoxide-([^-]+)(-|\.tar\.gz).*/\1/' | sort -u)
          echo "version: $versions"
          [ "$(wc -l <<<"$versions")" -eq 1 ]
      - uses: pypa/gh-action-pypi-publish@v1.14.3
