name: Releases

# One issue kept up to date every Monday, "New releases of all libraries": the one place that lists
# every library and dependency check. `photonoxide libraries --releases` writes its body and
# .github/scripts/keep-issue.sh keeps the issue (created if missing, its body rewritten, a
# comment only when a native library has a new release, nothing closed):
#
# - every library's newest release beside the version we use, grouped. The native libraries
#   photonoxide-native loads, read where their publishers put them (PyPI, anaconda.org, NVIDIA's
#   redistributables, GitHub releases, MUMPS's page, the macOS of GitHub's runners), beside the
#   version each install guide was checked with; then our direct dependencies, at our lockfiles'
#   and workflows' versions, against their registries: the Rust crates (crates.io's index), the
#   studio's pnpm packages (the npm registry), the Python requirements (PyPI) and the GitHub
#   Actions (their latest releases).
# - the major versions of those dependencies that our requirements don't take, which Dependabot
#   leaves out, each with its release notes, under "Major updates".
# - at the top, the open pull request in which Dependabot adopts the minor and patch updates
#   (found with gh, in the first step; its URL reaches the command as DEPENDABOT_PR).
#
# The issue was "New releases of external libraries" until it listed our own dependencies:
# --formerly renames that issue, keeping its number. "Major updates available" was a second issue
# until it was merged into this one: --merged closes it, with a comment, if it is still open.
#
# Never on a pull request: another project's release isn't a change of ours.
on:
  schedule:
    # Mondays, after the Libraries workflow's installs
    - cron: '37 5 * * 1'
  workflow_dispatch:

# reads the repository and its pull requests, and writes the issue; no other token or secret
permissions:
  contents: read
  issues: write
  pull-requests: read

# one run at a time, so two can't both create the issue
concurrency:
  group: releases
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  releases:
    name: New releases of all libraries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # sent to GitHub's API alone, for reading releases
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # what Tauri needs on Linux to compile; the window itself isn't opened, and an empty page
      # stands in for its web view's build
      - name: Tauri's prerequisites
        run: |
          # an Ubuntu mirror can stall apt-get update for over an hour: each try stops after 3
          # minutes, and the third failure fails the step
          for try in 1 2 3; do
            sudo timeout 180 apt-get update && break
            [ "$try" -lt 3 ] || exit 1
            echo "apt-get update: try $try of 3 failed or ran past 3 minutes; again in 15 s"
            sleep 15
          done
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p studio/dist
          echo '<!doctype html><title>photonoxide</title>' > studio/dist/index.html
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: build
        run: cargo build -p photonoxide-studio
      - name: Dependabot's open pull request
        # the one that adopts the minor and patch updates (its title starts "chore(deps)"), or
        # none: an empty URL
        run: |
          url=$(gh pr list --state open --author app/dependabot --limit 100 --json title,url \
            --jq 'map(select(.title | startswith("chore(deps)"))) | .[0].url // ""')
          echo "DEPENDABOT_PR=$url" >> "$GITHUB_ENV"
          echo "Dependabot's open pull request: ${url:-none open}"
      - name: New releases of all libraries
        run: bash .github/scripts/keep-issue.sh "New releases of all libraries" --formerly "New releases of external libraries" --merged "Major updates available" target/debug/photonoxide libraries --releases
