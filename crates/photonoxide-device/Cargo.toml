# photonoxide's device layer (docs/architecture.md, #508). Internal: users depend on photonoxide,
# which re-exports it at its old paths.
[package]
name = "photonoxide-device"
# photonoxide's version, from the workspace, as every crate here has it
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Internal crate of photonoxide (devices, component generators, the thermo-optic shifter); use photonoxide"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/photonoxide"
readme = "README.md"

[dependencies]
# the crates of the workspace pin each other exactly: they are released together
photonoxide-core = { version = "=0.6.0", path = "../photonoxide-core" }
photonoxide-geometry = { version = "=0.6.0", path = "../photonoxide-geometry" }
photonoxide-mode = { version = "=0.6.0", path = "../photonoxide-mode" }
photonoxide-statics = { version = "=0.6.0", path = "../photonoxide-statics" }
photonoxide-fdfd = { version = "=0.6.0", path = "../photonoxide-fdfd" }
photonoxide-circuit = { version = "=0.6.0", path = "../photonoxide-circuit" }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg", "rand"] }
libm = "0.2.16"
num-complex = "0.4"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
