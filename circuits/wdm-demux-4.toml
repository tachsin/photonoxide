# A four-channel demultiplexer: four add-drop rings along one bus, each 20 nm larger in radius
# than the one before (their round trips, `length`, 2π times 10, 10.02, 10.04 and 10.06 µm), so
# each resonates at its own wavelength and drops it to its own port; what no ring takes goes on
# to through. The add ports are terminated.
format = 1
name = "wdm-demux-4"
about = "A four-channel ring demultiplexer: four add-drop rings on one bus, their radii 20 nm apart, each dropping its own wavelength to its own port."

connections = [
    ["r1.through", "r2.in"],
    ["r2.through", "r3.in"],
    ["r3.through", "r4.in"],
    ["r1.add", "t1.o1"],
    ["r2.add", "t2.o1"],
    ["r3.add", "t3.o1"],
    ["r4.add", "t4.o1"],
]

[sweep]
from_um = 1.545
to_um = 1.565
points = 4001

