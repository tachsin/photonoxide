[package]
name = "photonoxide"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Validated, fabrication-ready photonics for Rust: mode solvers, FDFD, FDTD, inverse design, layout and PDKs, with a live studio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/photonoxide"
readme = "README.md"
keywords = ["photonics", "fdtd", "inverse-design", "electromagnetics", "silicon-photonics"]
categories = ["science", "simulation", "mathematics"]
# pre-alpha: remove on the first real release (no placeholder crates on crates.io)
publish = false

[dependencies]
# the studio's GUI; eframe 0.34 and later need a newer Rust than our 1.88
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

[features]
# the studio: the native window that shows runs live (`photonoxide run`, `photonoxide view`)
studio = ["dep:eframe"]
