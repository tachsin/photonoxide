[package]
name = "photonoxide"
version = "0.3.3"
edition = "2024"
rust-version = "1.95"
description = "Validated, fabrication-ready photonics for Rust: mode solvers, FDFD, FDTD, inverse design, layout and PDKs, with a live studio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/photonoxide"
readme = "README.md"
keywords = ["photonics", "fdtd", "inverse-design", "electromagnetics", "silicon-photonics"]
categories = ["science", "simulation", "mathematics"]
# what goes into the published crate: the library, its docs and jobs; not CI, the brand files or the project site
exclude = [".github", "assets", "site", "studio"]

# the studio (studio/src-tauri) is the photonoxide program: it runs jobs, live in its window or
# headless, and is built from the repository, not published
[workspace]
members = ["studio/src-tauri"]
default-members = ["."]

[dependencies]
faer = "0.24.4"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
yaml-rust2 = "0.13.0"

# the optimizers the circuit examples run on photonoxide's objectives and gradients: genoxide's
# L-BFGS-B, Adam and CMA-ES (AGENTS.md: optimizers come from genoxide). A dev-dependency, not a
# feature, so the library's API doesn't follow genoxide's versions; the studio, which builds the
# examples in, depends on it too.
[dev-dependencies]
genoxide = { version = "0.13.1", default-features = false }

# the solvers' heavy lifting runs in dependencies (faer's sparse LU) and in photonoxide itself (FDFD
# assembly, the mode solvers, QMR): optimize both in debug and test builds too, so `cargo test`
# stays fast. Unoptimized, a test that solves in earnest took 20 to 30 times as long, over a
# minute on CI's runners. Debug assertions and overflow checks stay on; users' builds are
# unaffected.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.photonoxide]
opt-level = 3
