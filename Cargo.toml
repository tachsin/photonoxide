[package]
name = "photonoxide"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Validated photonics for Rust: materials with provenance, mode solvers, 2D and 3D FDFD with S-parameters and adjoints, circuits and compact models, with a live studio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/photonoxide"
readme = "README.md"
keywords = ["photonics", "fdfd", "waveguide", "electromagnetics", "silicon-photonics"]
categories = ["science", "simulation", "mathematics"]
# what goes into the published crate: the library, its docs and jobs; not CI, the brand files, the
# project site, the program and its Academy's lessons, or the Python package
exclude = [".github", "academy", "assets", "python", "site", "studio"]

# the studio (studio/src-tauri) is the photonoxide program: it runs jobs, live in its window or
# headless, and is built from the repository, not published. python/ is the Python package
# (PyO3), which maturin builds; it shares photonoxide's version and Cargo.lock.
[workspace]
members = ["studio/src-tauri", "native", "native/testlib", "python"]
default-members = ["."]

[workspace.package]
# photonoxide's version, which every crate here has (the program, the native libraries' crate and
# the Python package take it with version.workspace): release-plz bumps it here
version = "0.5.4"

[dependencies]
# without faer's `npy` default: nothing here reads .npy files, and it brought pest, whose newer
# releases assemble and link .asm files (psm) at build time, against AGENTS.md's "nothing linked"
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg", "rand"] }
# deflate for exported files (export::write_mode_npz's .npz, issue #431): default features build
# on zlib-rs, a pure-Rust reimplementation, not a linked C zlib
flate2 = "1.1"
# the ZIP format's own checksum, for export's minimal ZIP writer (export::zip)
crc32fast = "1.5"
# polygon booleans for the geometry's layout polygons (geometry::Polygons::boolean): integer
# overlays on a fixed grid, robust on shared edges, touching vertices and collinear overlaps
# (docs/methods/booleans.md has the measurements that chose it); single-threaded, so the same
# bits on any thread count. MIT OR Apache-2.0, its own dependencies MIT
i_overlay = { version = "9.1.0", default-features = false }
# exp, sin and cos in pure Rust, the same bits on every system, where the system's maths library
# would move a result between Linux, Windows and macOS (the `portable` module)
libm = "0.2.16"
num-complex = "0.4"
# spectra: their wavelengths solved in parallel, each on its own, collected in order
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
yaml-rust2 = "0.13.0"
# job files in YAML (run::Format): serde, YAML 1.2, pure Rust with no unsafe code
serde-saphyr = "2.0"
# the job file's JSON Schema (job::schema), derived from the structs the tasks are read into so
# the two can't drift: what editors complete and check a job with. MIT, pure Rust
schemars = "1.2.3"
# FDTD on the GPU (the `gpu` feature): compute shaders on Vulkan, DirectX 12 or Metal, the
# system's driver loaded at run time; photonoxide's own code stays free of `unsafe`
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12", "metal"] }

[features]
# FDTD on the GPU through wgpu (fdtd::gpu): off by default, since wgpu and its shader compiler
# lengthen a clean build; CI builds and lints it, and its tests skip without a GPU
gpu = ["dep:wgpu"]

# faer's matrix-product kernel on x86, named here only for its version: 0.1.20's threaded
# complex product was wrong on AMD Zen 3 under Windows (GitHub's EPYC 7763 runners), and with
# it the 3D direct solves; 0.1.22's is right (sparse::multifrontal's test of the product)
[target.'cfg(target_arch = "x86_64")'.dependencies]
private-gemm-x86 = "0.1.22"

# the optimizers the circuit examples run on photonoxide's objectives and gradients: genoxide's
# L-BFGS-B, Adam and CMA-ES (AGENTS.md: optimizers come from genoxide). A dev-dependency, not a
# feature, so the library's API doesn't follow genoxide's versions; the studio, which builds the
# examples in, depends on it too.
[dev-dependencies]
genoxide = { version = "0.13.1", default-features = false }
# checks every built-in job against job::schema(): JSON Schema 2020-12, pure Rust, MIT OR Apache-2.0
boon = "0.6.1"
# export's own tests read the `.npz` its minimal ZIP writer (export::zip) made, with a real
# parser as the ground truth for the container format; only `deflate` (flate2, pure Rust): no
# bzip2, lzma or zstd, which link C
zip = { version = "4", default-features = false, features = ["deflate"] }

# the solvers' heavy lifting runs in dependencies (faer's sparse LU) and in photonoxide itself (FDFD
# assembly, the mode solvers, QMR): optimize both in debug and test builds too, so `cargo test`
# stays fast. Unoptimized, a test that solves in earnest took 20 to 30 times as long, over a
# minute on CI's runners. Debug assertions and overflow checks stay on; users' builds are
# unaffected.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.photonoxide]
opt-level = 3

# Debug and test builds keep file and line numbers for panics and backtraces, not the full debug
# info: with everything optimized it took longer to compile and link than it gave back (#507).
# CI sets CARGO_PROFILE_DEV_DEBUG=0. A debugger that needs variables: `debug = true` here, locally.
[profile.dev]
debug = "line-tables-only"

# What the Python wheels are built with (`--profile dist`, `just build-dist`): link-time
# optimization across crates and one codegen unit, for faster code at the cost of a slower build.
# Plain `--release` (CI, the tests, the examples) keeps Cargo's defaults, so its builds stay quick.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# The fastest code for one machine: fat LTO, built with `RUSTFLAGS="-C target-cpu=native"`
# (`just build-fastest`). Such a binary runs only on CPUs with the same instruction sets.
[profile.fastest]
inherits = "dist"
lto = "fat"
