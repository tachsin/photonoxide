# A 500 x 220 nm silicon strip on 220 nm SOI bent at a radius of 2 um, at 1.55 um, by the bend
# device's 3D model: the strip's cross-section by the full-vector solver, and the bend's shift by
# a conformal map, on the device's own grids. Its figures n_eff, along the arc, and radiation_90,
# the radiation loss per 90 degrees in dB, the guide itself lossless. examples/bend_loss.rs prints
# the same device's figures after its exact bent slabs and Marcuse's formula, and a test checks
# that this job's are its numbers, to the bit.
#   photonoxide run jobs/bend-2um-3d.yaml
name: bend-2um-3d
timeout_minutes: 10

device:
  kind: bend
  fidelity: 3D
  parameters:
    radius: "2"
    loss: "0"

task:
  kind: spectrum
