# An all-pass ring's trade-off between its loaded Q and its footprint, by genoxide's NSGA-II: its
# radius from 5 to 30 µm and its gap from 100 to 400 nm (analytic model: 500 x 220 nm strips in
# oxide, 20 dB/cm), Q made large and the radius small, with the dip at least 10 dB deep. The run
# grows the Pareto front of the two and its hypervolume as it goes. Opened, it shows on the
# ring's Optimize tab.
#   photonoxide run jobs/ring-pareto.toml   (live in the window; --headless for batches)
name = "ring-pareto"
timeout_minutes = 5

[device]
kind = "all-pass ring"
fidelity = "analytic"

[device.parameters]
loss = "20"

[task]
kind = "optimize"
method = "nsga2"
seed = 1
evaluations = 1200
population = 40

[[task.variable]]
parameter = "radius"
from = 5.0
to = 30.0

[[task.variable]]
parameter = "gap"
from = 0.1
to = 0.4

[[task.objective]]
name = "Q"
goal = "maximize"

[[task.objective]]
expression = "radius"
goal = "minimize"

[[task.constraint]]
name = "extinction"
at_least = 10.0
