# Jacques et al. 2019's TiN heater (Opt. Express 27, 10456, doi:10.1364/OE.27.010456) turned on:
# a 500 x 220 nm silicon strip on 2 um of buried oxide, a TiN heater 2.0 um wide and 100 nm thick
# 2 um above the strip's top, Table 3's conductivities and heat capacities, a 40 x 18 um region
# held at the ambient at its bottom with 10 W/(m^2 K) to the air above. 74.7 W/m is the paper's
# simulated Pi power, 23.9 mW over its 320 um. The strip's 1/e time comes out at 9.7 us on this
# grid (the paper's simulation: ~10.2 us); a 2D number, a straight section's.
#   photonoxide run jobs/tin-heater-transient.toml
name = "tin-heater-transient"
timeout_minutes = 10

[task]
kind = "static"
physics = "heat"
stack = "soi_220"           # the buried oxide from z = 0 to 2 um, the silicon film to 2.22 um
y_um = [-20.0, 20.0]
z_um = [-12.68, 5.32]       # 1 um of oxide over the heater, 18 um in all
step_nm = 500.0
fine_nm = 20.0              # at the strip's and the heater's corners

[[task.rect]]
layer = "Si"
center_um = [0.0, 0.0]
size_um = [10.0, 0.5]       # 500 nm wide, along x

[[task.region]]
y_um = [-0.25, 0.25]        # the strip, as the 220 nm film (Table 3's 90 W/(m K))
z_um = [2.0, 2.22]
medium = "Si film"

[[task.region]]
y_um = [-1.0, 1.0]
z_um = [4.22, 4.32]
medium = "TiN"

[task.thermal_conductivity] # W/(m K), Table 3
Si = 148.0
"Si film" = 90.0
SiO2 = 1.38
TiN = 28.0

[task.heat_capacity]        # rho c_p, J/(m^3 K): Table 3's density times specific heat
Si = 1.657e6                # 2330 kg/m^3, 711 J/(kg K)
"Si film" = 1.657e6
SiO2 = 1.562e6              # 2203, 709
TiN = 3.134e6               # 5240, 598

[task.transient]
step_ns = 200.0
duration_us = 40.0          # four time constants
scheme = "crank-nicolson"
turn = "on"

[task.boundary]
bottom = { fixed = 0.0 }
top = { convective = 10.0, ambient = 0.0 }

[[task.heater]]
y_um = [-1.0, 1.0]
z_um = [4.22, 4.32]
power_w_per_m = 74.7

[[task.probe]]
name = "strip"
y_um = [-0.25, 0.25]
z_um = [2.0, 2.22]
