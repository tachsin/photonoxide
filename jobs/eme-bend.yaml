# A 90-degree bend of a silicon slab by eigenmode expansion (docs/methods/eme.md, Bends): a
# 220 nm slab of silicon (3.473) in oxide (1.444), TM, bent at 2 um to the core's centre between
# two straights, swept from 1.5 to 1.6 um. The bend's modes are those of the conformal map's
# straight guide, its index n e^(u/R) (M. Heiblum, J. H. Harris, IEEE J. Quantum Electron. 11,
# 75 (1975), doi:10.1109/JQE.1975.1068563), in thin layers; the light it radiates leaves through
# the PML at the outer (upper) wall. The core sits 0.75 um below the window's middle in every
# section, so that the bend has 2.9 um of cladding outside it and 1.4 um inside.
# |S21|^2 between the straights' fundamental modes is 0.8991 at 1.55 um (0.46 dB): 0.19 dB of
# it is the bend's radiation (the validation case eme/bend-loss checks the bent mode's loss
# against the exact bent slab), the rest the two joints' mismatch between the straight's mode
# and the bent one, which sits further out. From 1.5 to 1.6 um it goes from 0.27 to 0.75 dB.
# A PML of strength 0.5 or 1 is followed too, from the closed window's modes (the method page's
# Bends); at 24 modes the three strengths agree within 1.5e-5.
#   photonoxide run jobs/eme-bend.yaml
name: eme-bend
timeout_minutes: 10

task:
  kind: eme
  wavelength_um: 1.55
  polarization: tm
  modes: 16
  window_um: 4.5
  pml: { thickness_um: 2.0, strength: 0.25, sides: upper }
  cladding: 1.444
  core: 3.473

  section:
    - { name: input, length_um: 0.0, core_um: 0.22, center_um: -0.75 }
    - { name: bend, radius_um: 2.0, angle_deg: 90.0, core_um: 0.22, center_um: -0.75 }
    - { name: output, length_um: 0.0, core_um: 0.22, center_um: -0.75 }

  sweep: { parameter: wavelength, from: 1.5, to: 1.6, points: 11 }