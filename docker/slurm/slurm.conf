# The cluster in Docker: a controller (slurmctld) and three compute nodes (c1, c2, c3), each a
# container of 2 CPUs. No accounting database and no cgroups: the containers share one machine's
# kernel, and the tests are of correctness, signals and the scheduler (docker/slurm/README.md).
ClusterName=photonoxide
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
CredType=cred/munge
MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
ReturnToService=2
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
# the nodes' CPUs as configured here, whatever the machine under them has
SlurmdParameters=config_overrides
JobAcctGatherType=jobacct_gather/none
AccountingStorageType=accounting_storage/none
# a time limit: SIGTERM, then SIGKILL KillWait seconds later (Slurm's default is 30 s)
KillWait=30
# the time limit is checked every 15 s or so: a job of 1 minute ends within about 1.5 minutes
OverTimeLimit=0
# a node that stops answering (a killed container) is marked down after 30 s
SlurmdTimeout=30
# slurmd on a node that is not its controller's host, reached by its container's name
NodeName=c[1-3] CPUs=2 RealMemory=1500 State=UNKNOWN
PartitionName=all Nodes=c[1-3] Default=YES MaxTime=INFINITE State=UP
