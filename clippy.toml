# The same numbers on every system (#822): compute with + − × ÷ and sqrt, and take every other
# function from `photonoxide::portable` (src/portable/). The system's versions below call glibc on
# Linux, the Microsoft C runtime on Windows and Apple's libm on macOS, which round differently, so a
# result through them can differ in its last bits between systems; `mul_add` is fused in hardware or
# in software, whichever the build has. Allowed: `f64::sqrt` (IEEE 754 rounds it exactly),
# `Complex::powi` and `powu` (products only), `norm_sqr`, `inv` and complex division.
#
# Crates not converted yet (the studio, native, crosscode) carry `#[allow(clippy::disallowed_methods)]`
# at their crate's root; .github/scripts/check-portable.sh counts those allows,
# which may only go down. A test may call the system's functions as an independent reference, with
# an allow of its own that says so. CONTRIBUTING.md, "The same numbers on every system".
disallowed-methods = [
  { path = "f64::powi", reason = "the system's maths library rounds differently on each system: use photonoxide::portable::powi (#822)" },
