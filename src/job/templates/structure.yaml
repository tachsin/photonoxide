# A ring resonator beside its bus on 220 nm SOI, as pictures of their permittivity: a structure
# job draws a design and solves nothing, to check it before a solver runs on it.
#   photonoxide run structure.yaml
name: new-structure
timeout_minutes: 2

task:
  kind: structure
  stack: soi_220
  wavelength: 1.55 um      # the permittivity is the materials' at this wavelength
  layer: Si
  x: [-4 um, 4 um]         # the window seen from above
  y: [-2.5 um, 2.5 um]
  step: 20 nm

  # lengths may be expressions with units, from parameters of your own
  parameters:
    gap: 200 nm
    radius: 1.5 um

  # the bus, 0.2 um below the ring, and the ring: one shape to a line
  shapes:
    - rect: { layer: Si, center: [0 um, "0.6 um - radius - 250 nm - gap - 250 nm"], size: [8 um, 500 nm] }
    - ring: { layer: Si, center_um: [0.0, 0.6], radius: radius, width: 500 nm }
