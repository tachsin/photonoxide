# The Academy's tracks and paths (studio/src-tauri/src/academy.rs reads this file; the format is
# academy/README.md's, "Tracks").
#
# A track is a shelf of lessons in the order to read them; every lesson is on exactly one track.
# A path is a way through the shelves for one kind of reader, a lesson on it read whole unless
# `sections` names the numbered sections it needs.

tracks:
  - id: waveguides
    title: Waveguides and materials
    summary: What silicon and silica do to light, and how a film, a strip and a bend hold it.
    lessons: [material-dispersion, slab-waveguide, strip-waveguide, leaky-and-bent-guides]

  - id: splitting
    title: Splitting and steering light
    summary: Moving light between waveguides, dividing it, crossing it and turning its polarization.
    lessons: [directional-coupler, mmi, crossings-and-converters]

  - id: filters
    title: Filters and resonators
    summary: Interference and feedback picking wavelengths out, in interferometers, rings, gratings and crystals.
    lessons: [mach-zehnder, ring-resonator, bragg-gratings, photonic-crystals]

  - id: coupling
    title: Coupling to the chip
    summary: Bringing light from a fibre onto the chip and back.
    lessons: [grating-couplers]

  - id: active
    title: Active devices
    summary: Changing light with heat, fields and its own intensity.
    lessons: [modulators, nonlinear-optics]

  - id: systems
    title: Circuits and systems
    summary: Devices joined into circuits that compute, switch and carry quantum states.
    lessons: [quantum-light]

  - id: methods
    title: Simulating, designing and making it
    summary: How the solvers work, how a design is found, and how a chip is made.
    lessons: [how-fdtd-works, fdfd-and-adjoints, how-a-chip-is-made, inverse-design]

  - id: beyond
    title: Beyond the waveguide
    summary: Light held by metals and shaped by surfaces, beside the silicon chip.
    shelf: true
    lessons: [plasmonics, metasurfaces]

paths:
  - id: from-zero
    title: Silicon photonics from zero
    summary: From what silicon does to light to a working filter, coupled to a fibre, made and tuned.
    lessons: [material-dispersion, slab-waveguide, strip-waveguide, directional-coupler, mach-zehnder, ring-resonator, grating-couplers, how-a-chip-is-made, modulators]
    sections:
      modulators: [2, 3]
