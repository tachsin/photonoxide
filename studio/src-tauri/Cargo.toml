# The photonoxide program: runs jobs, live in the studio window or headless, replays runs and
# checks the validation report. Built from the repository with the Tauri CLI (see
# studio/README.md), never published.
[package]
name = "photonoxide-studio"
# photonoxide's version, from the workspace, as every crate here has it
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "The photonoxide program and its studio window"
authors = ["tachsin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/photonoxide"
publish = false
default-run = "photonoxide"

# cargo-machete reads src/ only: the examples, built in from examples/ by `#[path]`, use faer
[package.metadata.cargo-machete]
ignored = ["faer"]

[[bin]]
name = "photonoxide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# without faer's `npy` default: nothing here reads .npy files, and it brought pest, whose newer
# releases assemble and link .asm files (psm) at build time, against AGENTS.md's "nothing linked"
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg", "rand"] }
# the nightly channel's source, main's tarball at a commit (channels.rs)
flate2 = "1"
# the optimizers of the circuit examples, which the program builds in (examples.rs)
genoxide = { version = "0.13.1", default-features = false }
num-complex = "0.4"
# a generation's points evaluated side by side (optimize.rs), on the library's pool
rayon = "1.12.0"
photonoxide = { path = "../.." }
# external libraries found at run time, for the benchmark's backends (bench --backends)
photonoxide-native = { path = "../../native" }
# the nightly channel: GitHub's API and main's tarball, over rustls with ring, as the updater does
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the builder's YAML jobs, read as the library reads them (photonoxide::run::Format)
serde-saphyr = "2.0"
tar = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-window-state = "2.5.0"
toml = "1"
# where the setup puts things: the user's local and roaming app data, and their Desktop, which
# may be moved (to OneDrive, say), as Windows' known folders say (setup.rs, which builds on every
# system and says elsewhere that it is for Windows)
dirs = "7"

[target."cfg(windows)".dependencies]
# the setup's shortcuts, written as .lnk files (pure Rust; setup.rs)
mslnk = "0.1.8"
# what the setup says when it can't open its window: a message box (the dialog plugin's, as is)
rfd = { version = "0.16", default-features = false }
# the setup's entry in Apps & Features, and the WebView2 runtime's version (setup.rs)
winreg = "0.56"
