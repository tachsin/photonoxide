# Releases: see CONTRIBUTING.md ("Releases")
[workspace]
# merging a release PR publishes to crates.io, through trusted publishing (no stored token)
publish = true
# cargo-semver-checks: a breaking public API change requires a breaking version bump
semver_check = true
changelog_update = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# not "latest" yet: the installed programs read their update manifest from the latest release, and
# the binaries and latest.json come minutes later (.github/workflows/binaries.yml marks the release
# latest once they are attached). Until then "latest" stays the previous, complete release.
git_release_latest = false
pr_labels = ["release"]
# only release when the release PR is merged
release_always = false

[changelog]
protect_breaking_commits = true
sort_commits = "oldest"
# link "(#12)" of squash merged PRs, in the CHANGELOG.md file as well
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tachsin/photonoxide/pull/${1}))" },
]
# groups are sorted by name: the invisible <!-- n --> comments set their order
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  # #336, reverted by #350 and held back for 0.6.0, where it comes back as #351
  # ("perf(fdfd)!: ...", which this doesn't match)
  { message = '^perf\(fdfd\): a multigrid without the finest matrix', skip = true },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  # a breaking build change (a higher minimum Rust) is the users' business
  { message = "^build!", group = "<!-- 3 -->Changed" },
  { message = "^(test|ci|build|chore|style)", skip = true },
  # PR titles are checked, so only the commits from before the checks end up here
  { message = ".*", group = "<!-- 5 -->Project setup" },
]

# Every crate in the workspace has photonoxide's version ([workspace.package] in Cargo.toml). photonoxide
# and the library's layers (crates/, #508) are released here, the layers with it; the others are
# named below with release = false, so a release bumps their version along with the workspace's
# (and their lines in Cargo.lock) and nothing else.

# photonoxide: its changelog has the layers' changes too, since users see them through it
[[package]]
name = "photonoxide"
changelog_include = [
  "photonoxide-core",
  "photonoxide-geometry",
  "photonoxide-linalg",
  "photonoxide-mode",
  "photonoxide-statics",
  "photonoxide-fdfd",
  "photonoxide-fdtd",
]

# the library's layers (crates/, docs/architecture.md): internal crates that photonoxide depends on
# exactly (=x.y.z) and re-exports at its own paths, published to crates.io with each release at
# photonoxide's version, with no tag, GitHub release or changelog of their own (photonoxide's
# lists their changes). Their API is photonoxide's business: photonoxide's is checked (CI's
# Public API job), theirs isn't. The first upload of each needs a crates.io token, before trusted
# publishing can be set up for it.
[[package]]
name = "photonoxide-core"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "photonoxide-geometry"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "photonoxide-linalg"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "photonoxide-mode"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "photonoxide-statics"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "photonoxide-fdfd"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "photonoxide-fdtd"
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

# the photonoxide program (studio/) is built from the repository and attached to the releases as
# binaries (.github/workflows/binaries.yml), never published to crates.io
[[package]]
name = "photonoxide-studio"
release = false
# overrides the workspace's publish = true, which must agree with its Cargo.toml
publish = false

# the Python package (python/) shares photonoxide's version, [workspace.package] in Cargo.toml,
# which a release bumps; it is published to PyPI (.github/workflows/python-wheels.yml, started
# by the release workflow), never to crates.io, and has no release of its own here
[[package]]
name = "photonoxide-python"
release = false
publish = false

# the external libraries' crate (native/), not published until its first backend lands, and the
# small C library its tests load
[[package]]
name = "photonoxide-native"
release = false
publish = false

[[package]]
name = "photonoxide-native-testlib"
release = false
publish = false

# release-plz gives the changelog only the commits that touch the crate's files, and Cargo.toml
# excludes studio/, site/ and python/: PRs that changed only those are added to the release PR by hand, and
# .github/workflows/changelog.yml lists them. (changelog_include = ["photonoxide-studio"] didn't
# bring them in for 0.4.1: the studio isn't released.)
