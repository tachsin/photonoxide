<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 398" width="1000" height="398" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">Cross-code comparison</title>
<desc id="desc">For each problem, each code's time on the same mesh (log scale) and its errors against photonoxide's converged result, in percent. The numbers are in docs/validation-openems.md and docs/validation-elmer.md.</desc>
<rect width="1000" height="398" fill="#1a1a19"/>
<text x="24" y="36" font-size="20" font-weight="600" fill="#f0efec">Cross-code comparison</text>
<text x="24" y="60" font-size="13" fill="#c3c2b7">Each code on the same mesh in each problem: its time, and its error against photonoxide's converged result.</text>
<text x="24" y="78" font-size="13" fill="#c3c2b7">photonoxide and Elmer solve the same 2D problems; openEMS solves the line in 3D and in time.</text>
<line x1="150.0" y1="112" x2="150.0" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="150.0" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.01 s</text>
<line x1="218.3" y1="112" x2="218.3" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="218.3" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.1 s</text>
<line x1="286.7" y1="112" x2="286.7" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="286.7" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1 s</text>
<line x1="355.0" y1="112" x2="355.0" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="355.0" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">10 s</text>
<line x1="423.3" y1="112" x2="423.3" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="423.3" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100 s</text>
<line x1="491.7" y1="112" x2="491.7" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="491.7" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1000 s</text>
<line x1="560.0" y1="112" x2="560.0" y2="342" stroke="#2c2c2a" stroke-width="1"/>
<text x="560.0" y="362.0" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">10000 s</text>
<text x="355.0" y="382.0" font-size="12" fill="#c3c2b7" text-anchor="middle">time, log scale</text>
<line x1="150" y1="342" x2="560" y2="342" stroke="#383835" stroke-width="1"/>
<text x="580" y="108.0" font-size="12" font-weight="600" fill="#c3c2b7">Time</text>
<text x="670" y="108.0" font-size="12" font-weight="600" fill="#c3c2b7">Error</text>
<text x="24" y="140.0" font-size="14" font-weight="600" fill="#f0efec">The coplanar line <tspan font-weight="400" fill="#c3c2b7">(the same mesh: smallest cell 0.25 µm)</tspan></text>
<text x="24" y="171.0" font-size="13" fill="#f0efec">photonoxide</text>
<line x1="150" y1="167.0" x2="560" y2="167.0" stroke="#2c2c2a" stroke-width="1"/><circle cx="201.7" cy="167.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="580" y="171.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">0.057 s</text>
<text x="670" y="171.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">n −0.0047 %  ·  Z₀ +0.75 %</text>
<text x="24" y="201.0" font-size="13" fill="#f0efec">openEMS</text>
<line x1="150" y1="197.0" x2="560" y2="197.0" stroke="#2c2c2a" stroke-width="1"/><circle cx="517.7" cy="197.0" r="6" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="580" y="201.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">40 min 8 s</text>
<text x="670" y="201.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">n −0.0039 %  ·  Z₀ −0.81 %</text>
<text x="24" y="231.0" font-size="13" fill="#f0efec">Elmer</text>
<line x1="150" y1="227.0" x2="560" y2="227.0" stroke="#2c2c2a" stroke-width="1"/><circle cx="199.5" cy="227.0" r="6" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="580" y="231.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">0.053 s</text>
<text x="670" y="231.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">n +0.00021 %  ·  Z₀ −0.43 %</text>
<text x="24" y="270.0" font-size="14" font-weight="600" fill="#f0efec">The heater <tspan font-weight="400" fill="#c3c2b7">(the same mesh: smallest cell 0.0125 µm)</tspan></text>
<text x="24" y="301.0" font-size="13" fill="#f0efec">photonoxide</text>
<line x1="150" y1="297.0" x2="560" y2="297.0" stroke="#2c2c2a" stroke-width="1"/><circle cx="188.3" cy="297.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="580" y="301.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">0.036 s</text>
<text x="670" y="301.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">peak rise +0.026 %</text>
<text x="24" y="331.0" font-size="13" fill="#f0efec">Elmer</text>
<line x1="150" y1="327.0" x2="560" y2="327.0" stroke="#2c2c2a" stroke-width="1"/><circle cx="207.7" cy="327.0" r="6" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="580" y="331.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">0.070 s</text>
<text x="670" y="331.0" font-size="13" fill="#f0efec" style="font-variant-numeric: tabular-nums">peak rise −0.012 %</text>
</svg>
