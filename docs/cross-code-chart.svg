<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">Cross-code check: each code's error against its time</title>
<desc id="desc">Each line is one code on one case through its meshes. The y axis is the error against photonoxide's converged result, in percent, on a log scale; the x axis is the code's own solve time, in seconds, on a log scale. The numbers are in docs/validation-openems.md and docs/validation-elmer.md.</desc>
<rect width="1000" height="640" fill="#fcfcfb"/>
<text x="84" y="34" font-size="19" font-weight="600" fill="#0b0b0b">Cross-code check: error against time</text>
<text x="84" y="58" font-size="13" fill="#52514e">Each line is one code on one case, through its meshes (finer meshes to the right). Lower is more accurate, left is faster.</text>
<text x="84" y="76" font-size="13" fill="#52514e">Error against photonoxide's converged result; time is each code's own solve. openEMS solves the line in 3D and in time, the others in 2D.</text>
<text x="84" y="94" font-size="13" fill="#52514e">Where an error changes sign from one mesh to the next its size dips (n). Elmer reports its heat solver's time to 0.01 s.</text>
